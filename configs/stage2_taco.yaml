# Stage 2 Configuration - TACO Classification & Segmentation Training

run_name: "stage2_taco"

dataset:
  synthetic: false
  taco_path: "data/TACO"
  batch_size: 8

# Joint classification and segmentation
loss:
  cls_weight: 0.5
  seg_weight: 0.5
  cls_loss_type: "focal"

training:
  epochs: 10
  early_stopping_patience: 3

optimizer:
  lr: 0.00005 # Lower learning rate for fine-tuning
